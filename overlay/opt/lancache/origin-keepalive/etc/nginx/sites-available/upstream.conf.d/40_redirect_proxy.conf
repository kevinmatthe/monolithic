# The original Location remains intact, including its authorization query string.
set $saved_upstream_location "";
access_log /data/logs/origin-redirect-hosts.log lancache_redirect_names if=$lancache_has_redirect;

location @upstream_redirect {
    set $saved_upstream_location $upstream_http_location;
    set $orig_loc 'upstream-302';
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $lancache_redirect_authority;
    proxy_ssl_server_name on;
    proxy_ssl_name $lancache_redirect_host;
    proxy_pass $lancache_redirect_url;
}
